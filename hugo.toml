baseURL = "https://provala.rs/"
title = "Provala"
theme = "selo"            # shared engine: github.com/kstein78/selo (git submodule in themes/selo)
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]
enableGitInfo = true
timeZone = "Europe/Belgrade"

# --- Languages -------------------------------------------------------------
# Prototype: Serbian (Latin; cyr = the same text in Cyrillic, generated by themes/selo/scripts/sr_cyrl.py),
# Croatian (right after Serbian: the Croatian border is a few km away), English and Russian. German and Hungarian switch on once translated (remove them from disableLanguages).
defaultContentLanguage = "sr"
defaultContentLanguageInSubdir = true
disableLanguages = ["de", "hu"]

[languages]
  [languages.sr]
    languageName = "Srpski"
    languageCode = "sr-Latn"
    weight = 1
    contentDir = "content/sr"
    [languages.sr.params]
      tagline = "Najdublje jezero Vojvodine, kod Vajske"
      description = "Jezero Provala kod Vajske: kupanje i plaža, pecanje, smeštaj, nastanak jezera i njegova voda, priroda i manifestacije u okolini Bača."
      ogLocale = "sr_RS"
  [languages.cyr]
    languageName = "Српски"
    languageCode = "sr-Cyrl"
    weight = 2
    contentDir = "content/cyr"
    [languages.cyr.params]
      tagline = "Најдубље језеро Војводине, код Вајске"
      description = "Језеро Провала код Вајске: купање и плажа, пецање, смештај, настанак језера и његова вода, природа и манифестације у околини Бача."
      ogLocale = "sr_RS"
  [languages.hr]
    languageName = "Hrvatski"
    languageCode = "hr"
    weight = 3
    contentDir = "content/hr"
    [languages.hr.params]
      tagline = "Najdublje jezero Vojvodine, kraj Vajske"
      description = "Jezero Provala kraj Vajske: kupanje i plaža, ribolov, smještaj, nastanak jezera i njegova voda, priroda i događanja u okolici Bača."
      ogLocale = "hr_HR"
  [languages.en]
    languageName = "English"
    languageCode = "en"
    weight = 4
    contentDir = "content/en"
    [languages.en.params]
      tagline = "The deepest lake in Vojvodina, near Vajska"
      description = "Lake Provala near Vajska, Serbia: swimming and the beach, fishing, where to stay, how the lake was formed, its water, nature and events around Bač."
      ogLocale = "en_US"
  [languages.ru]
    languageName = "Русский"
    languageCode = "ru"
    weight = 5
    contentDir = "content/ru"
    [languages.ru.params]
      tagline = "Самое глубокое озеро Воеводины, у Вайски"
      description = "Озеро Провала у Вайски (Сербия): купание и пляж, рыбалка, жильё, как появилось озеро и какая в нём вода, природа и события вокруг Бача."
      ogLocale = "ru_RU"
  [languages.de]
    languageName = "Deutsch"
    languageCode = "de"
    weight = 6
    contentDir = "content/de"
    [languages.de.params]
      tagline = "Der tiefste See der Vojvodina, bei Vajska"
      description = "Der Provala-See bei Vajska in Serbien."
      ogLocale = "de_DE"
  [languages.hu]
    languageName = "Magyar"
    languageCode = "hu"
    weight = 7
    contentDir = "content/hu"
    [languages.hu.params]
      tagline = "A Vajdaság legmélyebb tava, Vajszka mellett"
      description = "A Provala-tó Vajszka mellett, Szerbiában."
      ogLocale = "hu_HU"

# --- Site-wide settings ----------------------------------------------------
[params]
  mapCenter = [45.40014, 19.09103]   # the lake (OpenStreetMap / Nominatim)
  mapZoom = 14
  coordsLabel = "45.40° N 19.09° E"
  themeColor = "#0e4657"
  showPhotoBadges = false
  showTodos = false
  contactEmail = "seanews62@gmail.com"
  contactPhone = "+381638015320"          # Konstantin Stein, the same as on rakovac.rs (tel:, WhatsApp, Viber, Telegram)
  contactPhoneDisplay = "+381 63 801 5320"
  authorName = "Svetlana Morozova"
  defaultAuthor = "svetlana"          # data/authors.yaml; pages may set their own "author:"
  authorSite = ""
  instagram = ""
  instagramHandle = ""
  gaID = "G-21GTVFYL15"
  yandexMetrica = ""
  translatorContext = "provala.rs, a visitor site about Lake Provala near the village of Vajska (Bač municipality, Bačka, Vojvodina, Serbia): swimming, fishing, stays, nature"
  llmsIntro = """> Visitor site of Lake Provala (Serbian: Провала), a small, deep lake by the village of Vajska in Bač municipality,
> Vojvodina, Serbia, linked to the Danube underground: swimming and the beach, fishing, where to stay, how the lake was
> formed, its water and nature, events nearby. Edited by Svetlana Morozova, who lives in Vajska; co-founded and built by
> Konstantin (Kosta) Stein (rakovac.rs). Sister site about the village: https://vajska.rs/"""
  photoCredit = "credited under each photo"
  alternateNames = ["Provala", "Jezero Provala", "Језеро Провала", "provala.rs"]
  # Useful info page: weather on; air quality and the Danube gauge are rakovac.rs's (Beočin, Novi Sad)
  # and stay off until this site has its own sources (a SEPA station / an RHMZ gauge near Bač).
  [params.useful]
    weather = true
    air = false
    danube = false
  [params.place]
    type = "LakeBodyOfWater"
    name = "Jezero Provala"
    alternateNames = ["Provala", "Језеро Провала", "Lake Provala", "Озеро Провала"]
    containedIn = "Vajska, Bač municipality, Vojvodina, Serbia"
  [params.emblem]
    title = "Provala"
    letter = "P"
    corner = "reed"
    base = "fish"
    shield = "#0e4657"
    line = "#e0b062"
    ink = "#eef7f6"
    motif = "#8fd0cc"
    mono = "#eef7f6"
    touch_bg = "#eef4f3"
  [params.capital]
    # shield, outline/ornaments, leaf green, letter, light leaf, gold, mid green, red
    palette = ["#0e4657", "#e0b062", "#3e9a8f", "#eef7f6", "#8fd0cc", "#e0b062", "#5fb3ad", "#c2562f"]
    ornament = { P = "D" }   # waves under the P (the Rakovac P has grapes)
  [params.share]
    bg = "#0e4657"
    ink = "#eef7f6"
    sub = "#cfe6e4"
    accent = "#e0b062"
    photo = "img/placeholder-provala.jpg"
    logo = "img/brand-shield.svg"

[markup.goldmark.renderer]
  unsafe = true

[outputFormats.llms]
  mediaType = "text/plain"
  baseName = "llms"
  isPlainText = true
  notAlternative = true
  root = true

[outputs]
  home = ["HTML", "RSS", "llms"]
  section = ["HTML", "RSS"]

[sitemap]
  changeFreq = "weekly"
